
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traybeat"
version = "0.1.0"
description = "Webradio and playlist player that runs in the tray"
requires-python = ">=3.13"
dependencies = [
    
    "PyGObject>=3.58.1",
    "dbus-next>=0.2.3",
    "setproctitle>=1.3.8",
    "dacite>=1.9.2",
    "Pillow>=11.1.0",
    "websockets>=17.4",
    "pycairo >= 1.29.2",
    "pygments>=2.21.0" 

]

[project.optional-dependencies]
dev = ["pytest","PyGObject-stubs","nfp","build","pyright","ruff","requirements-parser","pytest-asyncio","appimage"]

[tool.setuptools]
py-modules = ["player"]


[tool.setuptools.packages.find]
where = ["src"]
include = ["traybeat*"]

[tool.setuptools.package-data]
traybeat = [
    "resources/**/*"
]

[tool.ruff]
line-length = 150  # Oder 120, damit mehr in eine Zeile passt

[tool.ruff.format]
# Das verhindert, dass Ruff Klammern unnötig weglässt oder erzwingt
skip-magic-trailing-comma = false

[project.scripts]
# Name des Befehls = "python_modul.datei:funktions_name"
traybeat = "traybeat.__main__:main"

[tool.appimage]
reproducible = true

#update this with: python -m appimage.ctl update-tools
build_pylock = "pylock.build.toml"
pylock = "pylock.toml"
app = "traybeat"
entry_point = "traybeat"
python = "3.13"
python_date = "20261110"
python_sha256 = "f2d2199eb25880e07863b391cf7124e7ffa1338b0d65600dfcec117c4223a7fb"
appimage_version = "4.1.0"
