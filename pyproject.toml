
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traybeat"
version = "0.1.5"
description = "Webradio and playlist player that runs in the tray"
requires-python = ">=3.13"
dependencies = [
    "dbus-next>=0.2.3",
    "setproctitle>=1.3.8",
    "dacite>=1.9.2",
    "Pillow>=11.1.0",
    "websockets>=17.4",
    "platformdirs"
]

[project.optional-dependencies]
dev = ["pytest","PyGObject-stubs","nfp","build","pyright","ruff","requirements-parser","pytest-asyncio","appimage"]

appimage = [
    "PyGObject>=3.42.0",
    "pycairo>=1.20.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["network: tests that need real internet access"]

[tool.setuptools]
py-modules = ["player"]


[tool.setuptools.packages.find]
where = ["src"]
include = ["traybeat*"]

[tool.setuptools.package-data]
traybeat = [
    "resources/**/*"
]

[tool.ruff]
line-length = 150  # Oder 120, damit mehr in eine Zeile passt

[tool.ruff.format]
# Das verhindert, dass Ruff Klammern unnötig weglässt oder erzwingt
skip-magic-trailing-comma = false

[project.scripts]
# Name des Befehls = "python_modul.datei:funktions_name"
traybeat = "traybeat.__main__:main"

[tool.appimage]
reproducible = true

#update this with: python -m appimage.ctl update-tools
build_pylock = "pylock.build.toml"
pylock = "pylock.toml"

app = "de.maza.traybeat"
entry_point = "traybeat"
python = "3.13"
python_date = "20261124"
python_sha256 = "b56ceb4fc1d8f0c49b7bd4dc91cd176bad7b86a88b9fc509bae6b10b3ee36692"
appimage_version = "4.1.0"
appimage_sha256 = "1d4bff605dad7b202bc2607562b663c316f7126f8c7af6098d669a4b9f207d01"
appimagetool_version = "appimagetool, continuous build (git version 8c8c91f), build 296 built on 2025-12-04 17:55:56 UTC"
appimagetool_sha256 = "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
runtime_sha256 = "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
